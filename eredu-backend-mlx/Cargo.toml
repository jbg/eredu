[package]
name = "eredu-backend-mlx"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MLX backend implementation for Eredu's neutral contracts"
readme = "README.md"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
no-default-features = true
features = ["image", "codec"]

[[example]]
name = "mimi_realtime_bench"
path = "examples/mimi_realtime_bench.rs"
required-features = ["codec"]

[[example]]
name = "personaplex_full_path_bench"
path = "examples/personaplex_full_path_bench.rs"
required-features = ["codec"]

[[example]]
name = "personaplex_quantization_eval"
path = "examples/personaplex_quantization_eval.rs"
required-features = ["codec"]

[features]
default = []
cuda = ["safemlx/cuda"]
nccl = ["cuda", "safemlx/nccl"]
media = []
image = ["media", "dep:image"]
audio = ["media", "dep:rustfft"]
codec = ["audio", "dep:eredu-codec"]

[dependencies]
eredu-core.workspace = true
eredu-checkpoint.workspace = true
eredu-nn.workspace = true
eredu-runtime.workspace = true
eredu-architectures.workspace = true
eredu-gguf.workspace = true
eredu-codec = { workspace = true, optional = true }
safemlx = { workspace = true, features = ["safetensors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
memmap2 = "0.9"
half.workspace = true
sha2.workspace = true
thiserror = "2"
libc = "0.2"
image = { version = "0.25", default-features = false, optional = true }
rustfft = { version = "6", optional = true }
smallvec = "1"
ref-cast = "1"

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eredu-evaluation.workspace = true
eredu-text = { workspace = true, default-features = false }
libc = "0.2"
tempfile.workspace = true
