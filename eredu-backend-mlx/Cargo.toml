[package]
name = "eredu-backend-mlx"
version = "0.10.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MLX backend implementation for Eredu's neutral contracts"
readme = "README.md"
include = [
    "src/**",
    "tests/**",
    "examples/*.rs",
    "examples/support/**",
    "validation/*.py",
    "doc/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
no-default-features = true
features = ["image"]

[[example]]
name = "mimi_realtime_bench"
path = "examples/mimi_realtime_bench.rs"

[[example]]
name = "personaplex_full_path_bench"
path = "examples/personaplex_full_path_bench.rs"

[[example]]
name = "personaplex_quantization_eval"
path = "examples/personaplex_quantization_eval.rs"

[features]
default = []
accelerate = ["safemlx/accelerate"]
metal = ["safemlx/metal"]
cuda = ["safemlx/cuda"]
nccl = ["cuda", "safemlx/nccl"]
image = ["eredu-architectures/image"]
audio = ["eredu-architectures/audio"]

[lints]
workspace = true

[dependencies]
eredu-core.workspace = true
eredu-checkpoint.workspace = true
eredu-nn.workspace = true
eredu-runtime.workspace = true
eredu-architectures.workspace = true
eredu-gguf.workspace = true
safemlx = { workspace = true, default-features = false, features = ["safetensors"] }
eredu-backend-mlx-macros.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
half.workspace = true
sha2.workspace = true
thiserror = "2"
smallvec = "1"
ref-cast = "1"

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eredu-evaluation.workspace = true
eredu-codec.workspace = true
eredu-text = { workspace = true, default-features = false }
tempfile.workspace = true
float_eq = "1"
pretty_assertions = "1"
