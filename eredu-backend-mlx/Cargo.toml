[package]
name = "eredu-backend-mlx"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MLX backend implementation for Eredu's neutral contracts"
readme = "README.md"
include = [
    "src/**",
    "examples/*.rs",
    "validation/**",
    "doc/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[package.metadata.docs.rs]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
no-default-features = true
features = ["image"]

[features]
tensor-capture = ["eredu-core/tensor-capture"]
default = []
accelerate = ["safemlx/accelerate"]
metal = ["safemlx/metal"]
cuda = ["safemlx/cuda"]
distributed = []
nccl = ["cuda", "distributed", "safemlx/nccl"]
image = []
audio = []
# Opt-in native diagnostic tooling; no collection in ordinary builds.
projection-profiling = []

[lints]
workspace = true

[dependencies]
eredu-core.workspace = true
eredu-checkpoint.workspace = true
eredu-nn.workspace = true
eredu-gguf.workspace = true
safemlx = { workspace = true, default-features = false, features = ["safetensors"] }
eredu-backend-mlx-macros.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8"
half.workspace = true
sha2.workspace = true
thiserror = "2"
smallvec = "1"
ref-cast = "1"
rayon = "1"
