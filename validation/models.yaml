# CUDA checkpoint validation manifest.
#
# Hub revisions and exact checkpoint byte counts were resolved from the public
# Hugging Face model API on 2026-08-14. Exact byte counts sum root-level
# `model*.safetensors` blobs only; tokenizer/codec and draft-model companions
# are listed separately. Keep revisions immutable. Updating a revision or a
# hardware profile is a reviewed baseline change, not routine test churn.

schema_version: 1
manifest_revision: 2
observed_at: "2026-08-14"

policy:
  artifact_format: safetensors
  comparison_scope: family_branch_modality
  require_immutable_hub_revision: true
  require_exact_input_token_ids: true
  require_finite_logits: true
  correctness_is_blocking: true
  performance_is_blocking: false
  remote_code:
    allow_only_publisher_owned_repositories: true
    require_pinned_revision: true
    model_mount_read_only: true
    allow_write_capable_hub_token: false
  result_states:
    - validated_real_checkpoint
    - validated_reduced_checkpoint
    - deferred_with_reason

input_sets:
  text_correctness:
    kind: text
    generation: deterministic
    prompts:
      - id: short_ascii
        text: "Explain why deterministic validation inputs matter in one sentence."
      - id: unicode_and_code
        text: "Return the UTF-8 text 'café Δ' and the Rust expression 7_u32 * 6."
      - id: recurrent_pattern_64
        text: "state zero, state one, state two, state three; "
        repeat: 16
      - id: recurrent_pattern_256
        text: "state zero, state one, state two, state three; "
        repeat: 64
      - id: punctuation_and_numbers
        text: "Sequence 0, 1, 1, 2, 3, 5, 8, 13; symbols: []{}()<>&*; answer with the next two values."
    teacher_forced_decode_tokens: 16
  text_performance:
    kind: token_ids
    generation: deterministic_repetition
    prompt_lengths: [128, 2048, 8192]
    generated_tokens: 128
  image_correctness:
    kind: generated_image
    generator: rgb_grid_v1
    width: 320
    height: 224
    seed: 1729
  video_correctness:
    kind: generated_video
    generator: moving_rgb_grid_v1
    width: 224
    height: 224
    frames: 8
    fps: 4
    seed: 1729
  audio_16khz_correctness:
    kind: generated_audio
    generator: sine_chirp_v1
    sample_rate_hz: 16000
    channels: 1
    duration_seconds: 2
    seed: 1729
  audio_24khz_correctness:
    kind: generated_audio
    generator: sine_chirp_v1
    sample_rate_hz: 24000
    channels: 1
    duration_seconds: 2
    seed: 1729

correctness_profiles:
  bf16_reference:
    reference_dtype: bf16
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.02
    cosine_similarity_min: 0.999
    top_k: 5
    top_k_overlap_min: 4
    require_unambiguous_argmax_match: true
    require_cached_vs_full_recompute: true
  lfm2_bf16_reference:
    reference_dtype: bf16
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.06
    cosine_similarity_min: 0.9985
    top_k: 5
    top_k_overlap_min: 4
    require_unambiguous_argmax_match: true
    require_cached_vs_full_recompute: true
  nemotron_h_bf16_reference:
    reference_dtype: bf16
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.025
    cosine_similarity_min: 0.999
    top_k: 5
    top_k_overlap_min: 4
    require_unambiguous_argmax_match: true
    argmax_margin_min: 0.25
    require_cached_vs_full_recompute: true
  native_mxfp4_reference:
    reference_dtype: checkpoint_native
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.05
    cosine_similarity_min: 0.995
    top_k: 5
    top_k_overlap_min: 3
    require_unambiguous_argmax_match: true
    require_cached_vs_full_recompute: true
  native_block_fp8_reference:
    reference_dtype: checkpoint_native
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.05
    cosine_similarity_min: 0.995
    top_k: 5
    top_k_overlap_min: 3
    require_unambiguous_argmax_match: true
    require_cached_vs_full_recompute: true
  native_nvfp4_reference:
    reference_dtype: checkpoint_native
    sampled_prefill_positions: [0, 7, -1]
    teacher_forced_decode_steps: 16
    relative_l2_max: 0.08
    cosine_similarity_min: 0.99
    top_k: 5
    top_k_overlap_min: 3
    require_unambiguous_argmax_match: true
    require_cached_vs_full_recompute: true
  realtime_bf16_reference:
    reference_dtype: bf16
    teacher_forced_temporal_steps: 8
    teacher_forced_depth_steps: 8
    relative_l2_max: 0.02
    cosine_similarity_min: 0.999
    require_unambiguous_argmax_match: true

benchmark_profiles:
  decoder_standard:
    warmup_runs: 1
    measured_runs: 5
    batch_size: 1
    prompt_lengths: [128, 2048, 8192]
    generated_tokens: 128
    report:
      - load_seconds
      - time_to_first_token_seconds
      - prefill_tokens_per_second
      - decode_tokens_per_second
      - mlx_peak_bytes
      - cuda_peak_bytes
    modes:
      - fully_resident_no_speculation
      - automatic_best_supported
  multimodal_standard:
    warmup_runs: 1
    measured_runs: 5
    batch_size: 1
    text_prompt_lengths: [128, 2048]
    generated_tokens: 128
    report:
      - load_seconds
      - media_encode_seconds
      - time_to_first_token_seconds
      - decode_tokens_per_second
      - mlx_peak_bytes
      - cuda_peak_bytes
    modes:
      - fully_resident_no_speculation
      - automatic_best_supported
  realtime_standard:
    warmup_runs: 1
    measured_runs: 5
    input_seconds: 10
    report:
      - load_seconds
      - first_output_frame_seconds
      - realtime_factor
      - generated_frames_per_second
      - mlx_peak_bytes
      - cuda_peak_bytes

