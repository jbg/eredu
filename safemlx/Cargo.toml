[package]
name = "safemlx"
version = "0.2.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
documentation = "https://docs.rs/safemlx"
description = "Low-level MLX execution layer used by the Eredu model runtime"
readme = "README.md"

[package.metadata.docs.rs]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-tvos",
    "aarch64-apple-visionos",
]

[dependencies]
safemlx-sys = { workspace = true, default-features = false }
safemlx-internal-macros.workspace = true
half = "2"
num-complex = "0.4"
num_enum = "0.7"
num-traits = "0.2"
paste = "1"
smallvec = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true
parking_lot = "0.12"

# optional dependencies
safetensors = { version = "0.8", optional = true }
bytemuck = { version = "1", optional = true, features = ["extern_crate_std"] }

[dev-dependencies]
pretty_assertions = "1"
float_eq = "1"
tempfile = "3"

[features]
default = ["accelerate", "metal"]

accelerate = ["safemlx-sys/accelerate"]
cuda = ["safemlx-sys/cuda"]
metal = ["safemlx-sys/metal"]
nccl = ["cuda", "safemlx-sys/nccl"]

# Enables conversion between `Array` and `safetensors::TensorView`
safetensors = ["dep:safetensors", "dep:bytemuck"]
