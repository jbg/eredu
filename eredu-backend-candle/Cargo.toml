[package]
name = "eredu-backend-candle"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Candle backend mechanisms for Eredu"

[lints]
workspace = true

[features]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels", "dep:objc2-metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
image = []
audio = []

[dependencies]
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
eredu-nn.workspace = true
eredu-checkpoint.workspace = true
eredu-gguf.workspace = true
eredu-core.workspace = true
thiserror.workspace = true
half.workspace = true
rayon = "1"
rustfft = "6"

[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = { version = "0.11", optional = true }
objc2-metal = { version = "0.3", optional = true }
