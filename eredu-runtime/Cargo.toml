[package]
name = "eredu-runtime"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral model execution runtime for Eredu"
readme = "README.md"

[lints]
workspace = true

[features]
# Read-only custody lifetime observations for downstream conformance tests.
original-custody-test-support = []

[dependencies]
eredu-collections.workspace = true
eredu-checkpoint.workspace = true
eredu-core.workspace = true
eredu-text = { workspace = true, default-features = false }
eredu-nn.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
safetensors = "0.8"
thiserror.workspace = true

# The qualified Darwin ledger owns std PAL pthread mutex and condvar allocations.
[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
libc = "=0.2.189"

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
eredu-text = { workspace = true, default-features = false, features = ["tokenizer-compiler-test-support", "stop-compiler-test-support"] }
eredu-gguf.workspace = true
tempfile.workspace = true
