name: SafeMLXDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  HuggingFace:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: 0.9.0

targets:
  SafeMLXDemo:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: HuggingFace
    preBuildScripts:
      - name: Build SafeMLX native library
        path: scripts/build-native.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle MLX Metal library
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$destination"
          cp "$SRCROOT/Build/native/mlx.metallib" "$destination/mlx.metallib"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SafeMLXDemo
        PRODUCT_NAME: SafeMLXDemo
        SWIFT_VERSION: "6.0"
        SWIFT_OBJC_BRIDGING_HEADER: App/Support/SafeMLXIOS-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/App/Support"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Build/native"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsafemlx_ios"
          - "-lc++"
          - "-framework"
          - Accelerate
          - "-framework"
          - Foundation
          - "-framework"
          - Metal
          - "-framework"
          - QuartzCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SafeMLX
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
