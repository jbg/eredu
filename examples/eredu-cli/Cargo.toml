[package]
name = "eredu-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Example command-line text generator for eredu"

[features]
cuda = ["safemlx/cuda", "eredu/cuda"]
nccl = ["cuda", "safemlx/nccl", "eredu/nccl"]

[[bin]]
name = "eredu"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hf-hub = { version = "=1.0.0", features = ["blocking"] }
safemlx.workspace = true
eredu.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
