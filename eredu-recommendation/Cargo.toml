[package]
name = "eredu-recommendation"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Revision-pinned model discovery, evidence-based recommendations, and Eredu memory assessment"
readme = "README.md"

[lints]
workspace = true

[features]
default = []
hub = ["dep:reqwest", "dep:futures", "dep:tokio", "dep:regex", "dep:tempfile", "dep:chrono"]
builder = ["hub", "dep:base64", "dep:sysinfo"]
cli = ["builder", "dep:clap"]
mlx = ["eredu/mlx"]
metal = ["eredu/metal"]
cuda = ["eredu/cuda"]
image = ["eredu/image"]
audio = ["eredu/audio"]

[[bin]]
name = "eredu-recommendation"
path = "src/bin/eredu-recommendation.rs"
required-features = ["cli"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
anyhow.workspace = true
base64 = { version = "0.22", optional = true }
clap = { workspace = true, optional = true }
eredu.workspace = true
eredu-architectures.workspace = true
eredu-core.workspace = true
futures = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system"], optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
