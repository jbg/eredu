[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
no-default-features = true
features = ["image-processing", "audio-processing"]

[features]
default = ["mlx", "onig", "esaxx_fast"]

mlx = ["dep:safemlx"]
cuda = ["mlx", "safemlx/cuda"]
esaxx_fast = ["tokenizers/esaxx_fast", "safemlx-lm-utils/esaxx_fast"]
onig = ["tokenizers/onig", "safemlx-lm-utils/onig"]
nccl = ["cuda", "safemlx/nccl"]
media-processing = ["mlx"]
image-processing = ["media-processing", "dep:image"]
audio-processing = ["media-processing", "dep:rustfft"]

[dependencies]
# Local dependencies
safemlx = { workspace = true, features = ["safetensors"], optional = true }
safemlx-lm-core.workspace = true
safemlx-lm-utils = { workspace = true, default-features = false }
safemlx-gguf.workspace = true

# External dependencies
serde = { version = "1", features = ["derive"] }
anyhow = "1"
base64 = "0.22"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
clap = { version = "4", features = ["derive"] }
idna_adapter = "1" 
thiserror = "2"
serde_json = "1"
minijinja = "2"
safetensors = "0.8"
memmap2 = "0.9"
tempfile.workspace = true
half.workspace = true
sha2.workspace = true
llguidance = { version = "=1.7.6", default-features = false, features = ["ahash", "lark"] }
toktrie_hf_tokenizers = "=1.7.6"
libc = "0.2"
image = { version = "0.25", default-features = false, optional = true }
rustfft = { version = "6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
lazy_static = "1"
