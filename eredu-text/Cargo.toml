[package]
name = "eredu-text"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral tokenizer and chat-template utilities for language model runtimes"
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true

[features]
default = ["onig", "esaxx_fast"]

esaxx_fast = ["tokenizers/esaxx_fast"]
onig = ["tokenizers/onig"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minijinja = { version = "2", features = ["json", "loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
eredu-gguf.workspace = true
