[package]
name = "eredu-text"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral tokenizer and chat-template utilities for language model runtimes"
readme = "README.md"

[package.metadata.docs.rs]
no-default-features = true

[features]
# Development-only ordinary chat compiler image emission; no runtime authority.
development-chat-recipe = ["minijinja/unstable_machinery_serde"]
default = ["onig", "esaxx_fast"]

# Development-only real capacity-overflow injection for original compiler custody tests.
decode-compiler-test-support = []
# Development-only failures in Eredu-owned decoder destinations.
tokenizer-compiler-test-support = ["decode-compiler-test-support"]

esaxx_fast = ["tokenizers/esaxx_fast"]
onig = ["tokenizers/onig"]

# Development-only real capacity-overflow injection at the two stop compiler reserves.
stop-compiler-test-support = []

[lints]
workspace = true

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minijinja = { version = "=2.24.0", features = ["json", "loader", "preserve_order", "fuel", "unstable_machinery"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2.workspace = true
thiserror = "2"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
eredu-gguf.workspace = true

# Backend-neutral exact grammar vocabulary storage; shared ordinary constructor.
toktrie = "=1.8.0"
