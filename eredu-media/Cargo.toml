[package]
name = "eredu-media"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-neutral host media transformations for Eredu"
readme = "README.md"

[features]
default = []
image = ["dep:image"]
audio = ["dep:rustfft"]
system-audio = ["audio", "dep:cpal", "dep:rtrb", "dep:rubato"]

[lints]
workspace = true

[dependencies]
eredu-core.workspace = true
thiserror.workspace = true
# The resize-buffer bound in image.rs tracks this exact implementation.
image = { version = "=0.25.10", default-features = false, optional = true }
rustfft = { version = "6", optional = true }
cpal = { version = "0.18.2", optional = true }
rtrb = { version = "0.3", optional = true }
rubato = { version = "0.16.2", default-features = false, optional = true }

[dev-dependencies]
eredu-evaluation.workspace = true
serde_json.workspace = true
