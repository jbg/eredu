name: Extended Ring conformance

on:
  schedule:
    - cron: '41 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  MLX_ENABLE_TF32: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          rustup toolchain install
          rustup component add llvm-tools-preview
          brew install meson ninja pkg-config
      - uses: ./.github/actions/build-cache
        id: cache
        with:
          variant: macos-accelerate
          rust: 'true'
      - name: Build the native library
        run: cargo build --locked -p safemlx-sys --no-default-features --features accelerate
      - uses: ./.github/actions/save-native-cache
        with:
          key: ${{ steps.cache.outputs.native-key }}
          hit: ${{ steps.cache.outputs.native-hit }}
      - name: Build the shared test executable
        run: python3 validation/run_native_ring_tests.py --profile conformance --features mlx,distributed,accelerate --export-executable target/ring-artifact/native-ring-tests
      - uses: actions/upload-artifact@v4
        with:
          name: ring-executable
          path: target/ring-artifact
          retention-days: 2
      - uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cache.outputs.rust-key }}
          hit: ${{ steps.cache.outputs.rust-hit }}
          max-mib: 1536

  conformance:
    needs: build
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Leave a hosted macOS slot available for ordinary PR validation.
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ring-executable
          path: ring-artifact
      - name: Run isolated Ring tests
        run: |
          chmod +x ring-artifact/native-ring-tests
          python3 validation/run_native_ring_tests.py --executable "$PWD/ring-artifact/native-ring-tests" \
            --shard ${{ matrix.shard }} --shards 5 \
            --test-timeout 600 --suite-timeout 1800 --results-dir target/ring-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-results-${{ matrix.shard }}
          path: target/ring-results
          retention-days: 7
