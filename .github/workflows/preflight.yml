name: Native validation
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  native:
    name: Native backend and consumers
    runs-on: macos-26
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Test Apple target mapping
        if: inputs.full
        run: |
          rustc --edition 2021 --test safemlx-sys/build_support.rs -o /tmp/safemlx-build-support-tests
          /tmp/safemlx-build-support-tests
      - name: Install Metal toolchain when required
        run: |
          if xcrun --toolchain Metal metal --version; then exit 0; fi
          if xcrun metal --version; then exit 0; fi
          xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/build-cache
        id: cache
        with:
          variant: macos-metal
          rust: 'true'
      - name: Build the native library
        run: cargo build --locked -p safemlx-sys --no-default-features --features metal,accelerate
      - uses: ./.github/actions/save-native-cache
        with:
          key: ${{ steps.cache.outputs.native-key }}
          hit: ${{ steps.cache.outputs.native-hit }}
      - name: Test scoped native backend and CLI consumers
        if: ${{ !inputs.full }}
        run: |
          cargo test --locked -p eredu-backend-mlx --features metal,accelerate --lib
          cargo test --locked -p eredu-cli --no-default-features --features mlx,metal
      - name: Test the macOS workspace
        if: inputs.full
        run: |
          cargo test --locked --workspace --features eredu-backend-mlx/metal,eredu-backend-mlx/accelerate -- \
            --skip cpu_stream_creation_is_concurrent_safe \
            --skip async_eval_cpu_streams_are_concurrent_safe
      - name: Test MLX neutral semantic operator parity
        if: inputs.full
        run: |
          cargo test -p eredu-backend-mlx --features metal,accelerate --lib \
            backend::nn::shared::neutral_semantic_operator_tests -- \
            --ignored
      - name: Test Metal cache residency and prefetch regressions
        if: inputs.full
        run: |
          cargo test -p eredu-backend-mlx --features metal,accelerate --lib \
            backend::runtime::cache::residency::tests::metal_cache_backend_preserves_ordering_persistence_and_aggregate_budgets -- \
            --ignored --exact
          cargo test -p eredu-backend-mlx --features metal,accelerate --lib \
            backend::runtime::cache::residency::tests::two_block_metal_prefetch_is_gpu_ordered_without_host_synchronization -- \
            --ignored --exact
      - name: Test full Ring conformance
        if: inputs.full
        run: |
          cargo test --locked -p eredu-backend-mlx --features metal,accelerate --lib _ring:: -- \
            --ignored --skip moshi_ring_tp2_native_model_parity \
            --skip moshi_ring_tp2_personaplex_model_parity --test-threads=1
      - name: Test concurrent MLX use
        if: inputs.full
        run: cargo test --locked -p safemlx --features metal,accelerate --lib concurrent_safe -- --test-threads=1
      - uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cache.outputs.rust-key }}
