name: Reusable Windows CUDA build

on:
  workflow_call:
    inputs:
      cuda:
        required: true
        type: string
      toolkit_version:
        required: true
        type: string
      cudnn_version:
        required: true
        type: string
      installer:
        required: true
        type: string
      cudnn:
        required: true
        type: string
      cuda_architectures:
        required: false
        type: string
        default: "75"

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: CUDA ${{ inputs.cuda }} / cuDNN 9 / MSVC
    runs-on: windows-2022
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      SAFEMLX_CUDA_ARCHITECTURES: ${{ inputs.cuda_architectures }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Configure the Visual Studio 2022 environment
        shell: cmd
        run: |
          pushd "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          for /f "delims=" %%x in ('.\vswhere.exe -latest -property InstallationPath') do set VSPATH=%%x
          popd
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          >>%GITHUB_ENV% set
      - name: Install CUDA ${{ inputs.cuda }} components
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @{
            "12.9" = @("cudart_12.9", "nvcc_12.9", "cublas_12.9", "cublas_dev_12.9", "cufft_12.9", "cufft_dev_12.9", "nvrtc_12.9", "nvrtc_dev_12.9")
            "13.0" = @("cudart_13.0", "nvcc_13.0", "cublas_13.0", "cublas_dev_13.0", "cufft_13.0", "cufft_dev_13.0", "nvrtc_13.0", "nvrtc_dev_13.0", "crt_13.0", "nvvm_13.0", "nvptxcompiler_13.0")
          }
          $webClient = New-Object System.Net.WebClient
          $webClient.DownloadFile("${{ inputs.installer }}", "cuda-installer.exe")
          $arguments = "-s " + ($packages["${{ inputs.cuda }}"] -join " ")
          $process = Start-Process -FilePath .\cuda-installer.exe -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CUDA installer exited with code $($process.ExitCode)"
          }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ inputs.cuda }}"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            throw "nvcc.exe was not installed at $cudaPath\bin\nvcc.exe"
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_HOME=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDAToolkit_ROOT=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CUDA_COMPILER=$cudaPath\bin\nvcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install cuDNN 9
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $webClient = New-Object System.Net.WebClient
          $webClient.DownloadFile("${{ inputs.cudnn }}", "cudnn.zip")
          Expand-Archive -Path cudnn.zip -DestinationPath cudnn-extracted
          $cudnnPath = (Get-ChildItem -Path cudnn-extracted -Directory)[0].FullName
          "CUDNN_INCLUDE_PATH=$cudnnPath\include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDNN_LIBRARY_PATH=$cudnnPath\lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudnnPath\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Show native tool versions
        run: |
          cmake --version
          ninja --version
          Get-Command cl
          nvcc --version
      - name: Cache CUDA build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: cuda-target-v1-windows-2022-${{ runner.arch }}-cuda${{ inputs.toolkit_version }}-cudnn${{ inputs.cudnn_version }}-sm${{ env.SAFEMLX_CUDA_ARCHITECTURES }}-rust${{ hashFiles('rust-toolchain.toml') }}-test-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'safemlx-sys/**') }}
          restore-keys: |
            cuda-target-v1-windows-2022-${{ runner.arch }}-cuda${{ inputs.toolkit_version }}-cudnn${{ inputs.cudnn_version }}-sm${{ env.SAFEMLX_CUDA_ARCHITECTURES }}-rust${{ hashFiles('rust-toolchain.toml') }}-test-
      - name: Build and final-link safemlx CUDA tests
        run: |
          cargo test -j 1 -p safemlx --features cuda --lib --no-run --no-default-features
          cargo test -j 1 -p safemlx --features cuda --test events --no-run --no-default-features
      - name: Build the linked CUDA smoke executable
        run: cargo test -j 1 -p safemlx --features cuda --example cuda_smoke --no-default-features --no-run
      - name: Build and final-link eredu configurations
        run: cargo test -j 1 -p eredu --no-default-features --features "cuda,image,audio" --no-run
      - name: Build and final-link the eredu CLI tests
        run: cargo test -j 1 -p eredu-cli --no-default-features --features cuda --no-run
      - name: Compile CUDA Mimi and integration tests
        run: |
          cargo test -j 1 -p eredu-backend-mlx --features cuda --test mimi_codec --no-run
          cargo test -j 1 -p safemlx-tests --no-default-features --features cuda --no-run
