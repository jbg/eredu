name: Release package validation

on:
  pull_request:
    paths:
      - ".github/workflows/release-packages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "LICENSE-*"
      - "rust-toolchain.toml"
      - "validation/validate_release_packages.py"
      - "doc/README.md"
      - "doc/releasing.md"
      - "eredu/**"
      - "eredu-*/**"
      - "safemlx/**"
      - "safemlx-*/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package publishable crates (${{ matrix.rust }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.rust == '1.89.0'
        id: msrv-toolchain
        uses: dtolnay/rust-toolchain@1.89.0
      - if: matrix.rust == '1.89.0'
        name: Select the installed MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=${{ steps.msrv-toolchain.outputs.name }}" >> "$GITHUB_ENV"
      - if: matrix.rust == 'stable'
        name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Install native CPU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev liblapacke-dev
          python3 -m pip install --user "cmake>=3.25"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build release archives in publication order
        run: python3 validation/validate_release_packages.py
