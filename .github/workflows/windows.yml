name: Windows builds

on:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - ".github/workflows/windows-cuda-build.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "safemlx/**"
      - "safemlx-sys/**"
      - "eredu/**"
      - "eredu-*/**"
      - "safemlx-tests/**"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_windows_gpu:
        description: Run tests on a preconfigured self-hosted Windows NVIDIA runner
        required: false
        type: boolean
        default: false

concurrency:
  group: windows-builds-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  cpu-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Configure the Visual Studio 2022 environment
        shell: cmd
        run: |
          pushd "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          for /f "delims=" %%x in ('.\vswhere.exe -latest -property InstallationPath') do set VSPATH=%%x
          popd
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          >>%GITHUB_ENV% set
      - name: Show native tool versions
        run: |
          cmake --version
          ninja --version
          Get-Command cl
      - name: Test the pure-Rust GGUF backend
        run: cargo test -p eredu-gguf
      - name: Test the portable facade and CPU CLI
        run: |
          cargo test --locked -p eredu --no-default-features --test portable_facade
          cargo test --locked -p eredu --no-default-features --test backend_conformance
          cargo test --locked -p eredu-cli --no-default-features --features mlx
      - name: Build and final-link safemlx tests
        run: |
          cargo test -p safemlx --lib --no-run --no-default-features
          cargo test -p safemlx --test events --no-run --no-default-features
      - name: Run Windows file-format tests, including Unicode Rust GGUF paths
        run: cargo test -p safemlx --lib --no-default-features ops::io::tests -- --test-threads=1
      - name: Build a linked safemlx executable
        run: cargo build -p safemlx --example tutorial --no-default-features
      - name: Compile the backend-neutral integration tests
        run: cargo test -p safemlx-tests --no-run

  cuda-msvc:
    name: CUDA 12.9 required
    uses: ./.github/workflows/windows-cuda-build.yml
    with:
      cuda: "12.9"
      toolkit_version: "12.9.1"
      cudnn_version: "9.23.2.1"
      installer: "https://developer.download.nvidia.com/compute/cuda/12.9.1/local_installers/cuda_12.9.1_576.57_windows.exe"
      cudnn: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.23.2.1_cuda12-archive.zip"

  cuda-gpu-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_gpu }}
    runs-on: [self-hosted, Windows, X64, cuda]
    env:
      SAFEMLX_CUDA_ARCHITECTURES: "75"
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Record GPU and toolkit versions
        run: |
          nvidia-smi
          nvcc --version
      - name: Test the pure-Rust GGUF backend
        run: cargo test --release -p eredu-gguf
      - name: Run safemlx CUDA tests
        run: cargo test --release -p safemlx --features cuda --lib --no-default-features
      - name: Run CUDA device and numerical smoke test
        run: cargo run --release -p safemlx --features cuda --example cuda_smoke --no-default-features
      - name: Run Eredu MLX integration tests on CUDA
        run: cargo test --release -p eredu --no-default-features --features cuda
