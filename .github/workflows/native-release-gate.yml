name: Native release gate

on:
  pull_request:
    paths:
      - '.github/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE-*'
      - 'safemlx/**'
      - 'safemlx-*/**'
      - 'eredu/**'
      - 'eredu-*/**'
      - 'examples/eredu-ios/**'
      - 'validation/**'
      - 'doc/releasing.md'
      - 'doc/README.md'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE-*'
      - 'safemlx/**'
      - 'safemlx-*/**'
      - 'eredu/**'
      - 'eredu-*/**'
      - 'examples/eredu-ios/**'
      - 'validation/**'
  workflow_dispatch:
    inputs:
      run_windows_gpu:
        description: Also run on the preconfigured self-hosted Windows NVIDIA runner
        type: boolean
        default: false
      run_linux_gpu:
        description: Also run on the preconfigured self-hosted Linux NVIDIA runner
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-release-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  apple:
    needs: preflight
    uses: ./.github/workflows/apple-platforms.yml

  linux:
    needs: preflight
    uses: ./.github/workflows/linux.yml
    with:
      run_gpu: ${{ github.event_name == 'workflow_dispatch' && inputs.run_linux_gpu == true }}

  windows:
    needs: preflight
    uses: ./.github/workflows/windows.yml
    with:
      # Main and explicit release validation cover both toolkits in one matrix.
      extended_cuda: ${{ github.event_name != 'pull_request' }}
      run_windows_gpu: ${{ github.event_name == 'workflow_dispatch' && inputs.run_windows_gpu == true }}

  packages:
    needs: preflight
    uses: ./.github/workflows/release-packages.yml
