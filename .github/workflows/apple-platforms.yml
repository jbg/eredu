name: Apple platform builds

on:
  pull_request:
    paths:
      - ".github/workflows/apple-platforms.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "safemlx/**"
      - "safemlx-sys/**"
      - "safemlx-internal-macros/**"
      - "safemlx-tests/**"
      - "eredu/**"
      - "eredu-*/**"
      - "examples/eredu-ios/**"
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Metal toolchain when required
        run: |
          if xcrun --toolchain Metal metal --version; then
            exit 0
          fi
          if xcrun metal --version; then
            exit 0
          fi
          xcodebuild -downloadComponent MetalToolchain
      - name: Require native MLX execution
        run: |
          cargo test -p eredu-backend-mlx --features metal --lib \
            composition::mlx_architecture_conformance::native_mlx_execution_is_available -- \
            --exact
      - name: Test the macOS workspace
        run: |
          cargo test --workspace -- \
            --skip cpu_stream_creation_is_concurrent_safe \
            --skip async_eval_cpu_streams_are_concurrent_safe
      - name: Test MLX neutral semantic operator parity
        run: |
          cargo test -p eredu-backend-mlx --features metal --lib \
            backend::nn::shared::neutral_semantic_operator_tests -- \
            --ignored
      - name: Test Metal cache residency and prefetch regressions
        run: |
          cargo test -p eredu-backend-mlx --features metal --lib \
            backend::runtime::cache::residency::tests::metal_cache_backend_preserves_ordering_persistence_and_aggregate_budgets -- \
            --ignored --exact
          cargo test -p eredu-backend-mlx --features metal --lib \
            backend::runtime::cache::residency::tests::two_block_metal_prefetch_is_gpu_ordered_without_host_synchronization -- \
            --ignored --exact
      - name: Test distributed partition lifecycles
        run: |
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_two_process_pipeline -- \
            --ignored --exact --nocapture
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_two_process_qwen3_moe_pipeline -- \
            --ignored --exact --nocapture
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_two_process_lfm2_moe_pipeline -- \
            --ignored --exact --nocapture
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_two_process_kimi_linear_dense_stream_pipeline -- \
            --ignored --exact --nocapture
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_four_process_deepseek_tensor_pipeline -- \
            --ignored --exact --nocapture
          cargo test -p eredu-backend-mlx --lib \
            tests::distributed_pipeline_ring::ring_four_process_deepseek_v4_tensor_pipeline -- \
            --ignored --exact --nocapture
      - name: Test the MLX codec backend
        run: cargo test -p eredu-backend-mlx --features codec
      - name: Test concurrent MLX use
        run: cargo test --workspace concurrent_safe -- --test-threads=1

  target-mapping:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Apple target mapping
        run: |
          rustc --edition 2021 --test safemlx-sys/build_support.rs -o /tmp/safemlx-build-support-tests
          /tmp/safemlx-build-support-tests

  cross-build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim
          - aarch64-apple-visionos
          - aarch64-apple-visionos-sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install Metal toolchain when required
        run: |
          if xcrun --toolchain Metal metal --version; then
            exit 0
          fi
          if xcrun metal --version; then
            exit 0
          fi
          xcodebuild -downloadComponent MetalToolchain
      - name: Cross-build the MLX stack and facade
        run: |
          cargo build --locked --release -p safemlx --target "${{ matrix.target }}"
          cargo build --locked --release -p eredu-backend-mlx --target "${{ matrix.target }}"
          cargo build --locked --release -p eredu --no-default-features --features mlx --target "${{ matrix.target }}"
      - name: Cross-build the iOS example
        if: startsWith(matrix.target, 'aarch64-apple-ios')
        run: cargo build --locked --release -p eredu-ios --target "${{ matrix.target }}"
      - name: Verify Metal resource
        run: test -s "target/${{ matrix.target }}/release/safemlx-resources/mlx.metallib"
