name: Apple platform builds

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim
          - aarch64-apple-visionos
          - aarch64-apple-visionos-sim
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository Rust toolchain
        run: rustup toolchain install
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Install Metal toolchain when required
        run: |
          if xcrun --toolchain Metal metal --version; then
            exit 0
          fi
          if xcrun metal --version; then
            exit 0
          fi
          xcodebuild -downloadComponent MetalToolchain
      - uses: ./.github/actions/build-cache
        id: cache
        with:
          variant: apple-${{ matrix.target }}
          rust: 'true'
      - name: Cross-build the native library
        run: cargo build --locked --release -p safemlx-sys --target "${{ matrix.target }}"
      - uses: ./.github/actions/save-native-cache
        with:
          key: ${{ steps.cache.outputs.native-key }}
          hit: ${{ steps.cache.outputs.native-hit }}
      - name: Cross-build the MLX stack and facade
        run: |
          cargo build --locked --release -p safemlx --target "${{ matrix.target }}"
          cargo build --locked --release -p eredu-backend-mlx --features metal,accelerate --target "${{ matrix.target }}"
          cargo build --locked --release -p eredu --no-default-features --features mlx,metal --target "${{ matrix.target }}"
      - name: Cross-build the iOS example
        if: startsWith(matrix.target, 'aarch64-apple-ios')
        run: cargo build --locked --release -p eredu-ios --target "${{ matrix.target }}"
      - name: Verify Metal resource
        run: test -s "target/${{ matrix.target }}/release/safemlx-resources/mlx.metallib"
      - uses: ./.github/actions/save-rust-cache
        with:
          key: ${{ steps.cache.outputs.rust-key }}
