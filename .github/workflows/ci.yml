name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'LICENSE-*'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'LICENSE-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/preflight.yml
    with:
      full: false
