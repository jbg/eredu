name: Publish CUDA validation image

on:
  push:
    branches: [jbg/validation-cuda-image]
    paths:
      - ".dockerignore"
      - ".github/workflows/publish-validation-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "safemlx/**"
      - "safemlx-sys/**"
      - "eredu/**"
      - "eredu-text/**"
      - "safemlx-macros/**"
      - "safemlx-internal-macros/**"
      - "validation/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-cuda-validation-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jbg/eredu-validation
  VERSION_TAG: cuda12.9.1-rust1.89.0-torch2.8.0-v1

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve reproducible image metadata
        id: source
        shell: bash
        run: |
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Detect Docker context changes
        id: context_changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "push" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- . ':(exclude).github/**'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION_TAG }}
            type=raw,value=${{ env.VERSION_TAG }}-git-${{ steps.source.outputs.short_sha }}

      # Export the expensive Rust/CUDA builder independently. If a later
      # runtime-image check fails, retries reuse this successful layer instead
      # of recompiling the CUDA probe for another ~45 minutes.
      - name: Build and cache the checkpoint probe
        if: steps.context_changes.outputs.changed == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: validation/container/Dockerfile
          platforms: linux/amd64
          target: checkpoint-probe-builder
          cache-from: type=gha,scope=cuda-validation-amd64-builder
          cache-to: type=gha,mode=max,scope=cuda-validation-amd64-builder

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: validation/container/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cuda-validation-amd64-builder
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.source.outputs.created }}
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ env.VERSION_TAG }}

      - name: Verify the published manifest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          echo "published=${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
