name: Restore Rust and native builds
description: Cache CMake independently of Cargo versions, and retain Rust artifacts separately.
inputs:
  variant:
    description: Native platform/toolkit configuration (include CUDA and cuDNN versions).
    required: true
  rust:
    description: Restore a bounded Rust build snapshot; save with save-rust-cache after validation.
    default: 'false'
  target:
    description: Cargo target directory to cache.
    default: target
outputs:
  native-key:
    description: Key for saving a successful native build.
    value: ${{ steps.native.outputs.cache-primary-key }}
  native-hit:
    description: Whether the native cache was an exact hit.
    value: ${{ steps.native.outputs.cache-hit }}
  rust-key:
    description: Key for saving this candidate's Rust snapshot.
    value: ${{ steps.rust.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Identify native and Rust toolchains
      id: tools
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python validation/build_cache_identity.py
        else
          python3 validation/build_cache_identity.py
        fi
    - name: Restore native CMake build
      id: native
      uses: actions/cache/restore@v4
      with:
        path: .native-build
        key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ steps.tools.outputs.native }}-${{ hashFiles('safemlx-sys/build.rs', 'safemlx-sys/build_support.rs', 'safemlx-sys/src/**', 'safemlx-sys/vendor/**') }}
        restore-keys: |
          native-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}-${{ steps.tools.outputs.native }}-
    - name: Restore Rust build artifacts
      # A cached build-script result can refer to native files outside target.
      # Only restore it when a native tree is available too.
      id: rust
      uses: actions/cache/restore@v4
      if: inputs.rust == 'true'
      with:
        path: ${{ inputs.target }}
        # Refresh successful source builds, then retain only the latest bounded
        # snapshot per configuration in the gate's cache-maintenance job.
        key: rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.variant }}--${{ steps.tools.outputs.native }}-${{ steps.tools.outputs.rust }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}--${{ github.sha }}
        restore-keys: |
          ${{ steps.native.outputs.cache-matched-key != '' && format('rust-v3-{0}-{1}-{2}--{3}-{4}-', runner.os, runner.arch, inputs.variant, steps.tools.outputs.native, steps.tools.outputs.rust) || 'no-native-cache-no-rust-restore-' }}
        lookup-only: ${{ steps.native.outputs.cache-matched-key == '' }}
