[workspace]
members = [
    "eredu-collections",
    "eredu-gguf",
    "safemlx",
    "safemlx-sys",
    "eredu-backend-mlx-macros",
    "safemlx-internal-macros",
    "safemlx-tests",
    "eredu",
    "eredu-core",
    "eredu-text",
    "eredu-checkpoint",
    "eredu-nn",
    "eredu-nn-macros",
    "eredu-backend-mlx",
    "eredu-runtime",
    "eredu-architectures",
    "eredu-codec",
    "eredu-media",
    "eredu-evaluation",
    "eredu-cli",
    "examples/eredu-ios/native",
    "third-party/derivre-0.3.12",
    "third-party/llguidance-1.8.0",
    "third-party/toktrie-1.8.0",
    "third-party/regex-syntax-0.8.11",
    "third-party/referencing-0.52.1",
    "third-party/jsonschema-regex-0.52.1",
    "third-party/email_address-0.2.9",
    "third-party/num-bigint-0.4.8",
    "third-party/num-rational-0.4.2",
    "third-party/fraction-0.17.0",
    "third-party/idna-1.1.0",
    "third-party/idna_adapter-1.2.2",
    "third-party/icu_normalizer-2.3.0",
    "third-party/fancy-regex-0.19.0",
    "third-party/regex-1.13.1",
]
# Audited external dependencies retain their upstream lint boundaries.
exclude = ["third-party/aho-corasick-1.1.5", "third-party/memchr-2.8.3", "third-party/indexmap-2.14.2", "third-party/fluent-uri-0.4.1", "third-party/jsonschema-value-0.52.1", "third-party/jsonschema-0.52.0", "third-party/hashbrown-0.17.1", "third-party/serde_json-1.0.151", "third-party/minijinja-2.24.0", "third-party/tokenizers-0.23.2", "third-party/regex-automata-0.4.18", "third-party/unicode-normalization-alignments-0.1.12"]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
edition = "2021"
authors = ["Jasper Hugo <jasper@jasperhugo.com>"]
repository = "https://github.com/jbg/eredu"
keywords = ["mlx", "deep-learning", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"

[workspace.dependencies]
eredu-collections = { version = "0.1.0", path = "eredu-collections" }
safemlx = { version = "0.3.1", path = "safemlx", default-features = false }
eredu-gguf = { version = "0.1.0", path = "eredu-gguf" }
safemlx-sys = { version = "0.2.3", path = "safemlx-sys", default-features = false }
eredu-backend-mlx-macros = { version = "0.1.0", path = "eredu-backend-mlx-macros" }
safemlx-internal-macros = { version = "0.2.0", path = "safemlx-internal-macros" }
eredu = { version = "0.5.0", path = "eredu", default-features = false }
eredu-core = { version = "0.5.0", path = "eredu-core" }
eredu-text = { version = "0.1.1", path = "eredu-text", default-features = false }
eredu-checkpoint = { version = "0.2.0", path = "eredu-checkpoint" }
eredu-nn = { version = "0.2.1", path = "eredu-nn", default-features = false }
eredu-nn-macros = { version = "0.1.0", path = "eredu-nn-macros" }
eredu-backend-mlx = { version = "0.5.0", path = "eredu-backend-mlx", default-features = false }
eredu-runtime = { version = "0.5.0", path = "eredu-runtime" }
eredu-architectures = { version = "0.5.0", path = "eredu-architectures" }
eredu-codec = { version = "0.5.0", path = "eredu-codec", default-features = false }
eredu-media = { version = "0.4.0", path = "eredu-media", default-features = false }
eredu-evaluation = { version = "0.5.0", path = "eredu-evaluation" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
itertools = "0.15"
bindgen = "0.73"
cmake = "0.1"
tempfile = "3"
half = "2"
sha2 = "0.11"

# Checkpoint identity reads can hash many GiB even during development. Keep the
# SHA-2 compression kernels optimized while Eredu itself remains debuggable.
[profile.dev.package.sha2]
opt-level = 3

# Pinned Rust parser sources provide allocation facts and checks before growth.
# Provenance and the local Rust-only boundary are recorded in third-party/README.md.
[patch.crates-io]
# Original literal searchers with safe prospective source producers.
aho-corasick = { path = "third-party/aho-corasick-1.1.5" }
memchr = { path = "third-party/memchr-2.8.3" }
num-bigint = { path = "third-party/num-bigint-0.4.8" }
num-rational = { path = "third-party/num-rational-0.4.2" }
fraction = { path = "third-party/fraction-0.17.0" }
idna = { path = "third-party/idna-1.1.0" }
idna_adapter = { path = "third-party/idna_adapter-1.2.2" }
icu_normalizer = { path = "third-party/icu_normalizer-2.3.0" }
email_address = { path = "third-party/email_address-0.2.9" }
regex-syntax = { path = "third-party/regex-syntax-0.8.11" }
regex = { path = "third-party/regex-1.13.1" }
# Pinned full-schema engine with explicit original validation workspace.
jsonschema = { path = "third-party/jsonschema-0.52.0" }
jsonschema-value = { path = "third-party/jsonschema-value-0.52.1" }
fluent-uri = { path = "third-party/fluent-uri-0.4.1" }
referencing = { path = "third-party/referencing-0.52.1" }
jsonschema-regex = { path = "third-party/jsonschema-regex-0.52.1" }
# Exact prospective table allocation through the pinned ordinary hashbrown worker.
hashbrown = { path = "third-party/hashbrown-0.17.1" }
# Insertion-ordered entries use the same prospective table/vector reservation.
indexmap = { path = "third-party/indexmap-2.14.2" }
# Same pinned serde_json parser with dependency-owned scalar storage facts.
serde_json = { path = "third-party/serde_json-1.0.151" }
# Shared closed chat storage uses the pinned ordinary MiniJinja dispatcher.
minijinja = { path = "third-party/minijinja-2.24.0" }
unicode-normalization-alignments = { path = "third-party/unicode-normalization-alignments-0.1.12" }
derivre = { path = "third-party/derivre-0.3.12" }
llguidance = { path = "third-party/llguidance-1.8.0" }
# Source-derived destinations around the same llguidance token trie builder.
toktrie = { path = "third-party/toktrie-1.8.0" }
# Safe borrowed decode accessors; provenance in third-party/tokenizers-upstream.json.
tokenizers = { path = "third-party/tokenizers-0.23.2" }

# Closed fallible PikeVM workspace; exact upstream provenance in third-party/regex-automata-workspace.json.
regex-automata = { path = "third-party/regex-automata-0.4.18" }

# Canonical 0.19 engine for tokenizer and schema consumers; original workers and explicit search storage.
fancy-regex = { path = "third-party/fancy-regex-0.19.0" }
