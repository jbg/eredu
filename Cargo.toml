[workspace]
members = [
    "eredu-gguf",
    "safemlx",
    "safemlx-sys",
    "eredu-backend-mlx-macros",
    "safemlx-internal-macros",
    "safemlx-tests",
    "eredu",
    "eredu-core",
    "eredu-text",
    "eredu-checkpoint",
    "eredu-nn",
    "eredu-nn-macros",
    "eredu-backend-mlx",
    "eredu-runtime",
    "eredu-architectures",
    "eredu-codec",
    "eredu-evaluation",
    "eredu-cli",
    "examples/eredu-ios/native",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.package]
edition = "2021"
authors = ["Jasper Hugo <jasper@jasperhugo.com>"]
repository = "https://github.com/jbg/eredu"
keywords = ["mlx", "deep-learning", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"

[workspace.dependencies]
safemlx = { version = "0.2.2", path = "safemlx", default-features = false }
eredu-gguf = { version = "0.1.0", path = "eredu-gguf" }
safemlx-sys = { version = "0.2.1", path = "safemlx-sys", default-features = false }
eredu-backend-mlx-macros = { version = "0.1.0", path = "eredu-backend-mlx-macros" }
safemlx-internal-macros = { version = "0.2.0", path = "safemlx-internal-macros" }
eredu = { version = "0.1.0", path = "eredu", default-features = false }
eredu-core = { version = "0.1.0", path = "eredu-core" }
eredu-text = { version = "0.1.0", path = "eredu-text", default-features = false }
eredu-checkpoint = { version = "0.1.0", path = "eredu-checkpoint" }
eredu-nn = { version = "0.1.0", path = "eredu-nn", default-features = false }
eredu-nn-macros = { version = "0.1.0", path = "eredu-nn-macros" }
eredu-backend-mlx = { version = "0.1.2", path = "eredu-backend-mlx", default-features = false }
eredu-runtime = { version = "0.1.0", path = "eredu-runtime" }
eredu-architectures = { version = "0.1.0", path = "eredu-architectures" }
eredu-codec = { version = "0.1.0", path = "eredu-codec", default-features = false }
eredu-evaluation = { version = "0.1.0", path = "eredu-evaluation" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
itertools = "0.15"
bindgen = "0.72"
cmake = "0.1"
tempfile = "3"
half = "2"
sha2 = "0.11"
