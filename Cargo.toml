[workspace]
members = [
    "eredu-gguf",
    "safemlx",
    "safemlx-sys",
    "safemlx-macros",
    "safemlx-internal-macros",
    "safemlx-tests",
    "eredu",
    "eredu-core",
    "eredu-text",
    "eredu-checkpoint",
    "eredu-nn",
    "eredu-runtime",
    "eredu-architectures",
    "eredu-codec",
    "eredu-cli",
    "examples/eredu-ios/native",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Jasper Hugo <jasper@jasperhugo.com>"]
repository = "https://github.com/jbg/safemlx"
keywords = ["mlx", "deep-learning", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"
rust-version = "1.89.0"

[workspace.dependencies]
safemlx = { version = "0.1.3", path = "safemlx" }
eredu-gguf = { version = "0.1.0", path = "eredu-gguf" }
safemlx-sys = { version = "0.1.3", path = "safemlx-sys", default-features = false }
safemlx-macros = { version = "0.1.1", path = "safemlx-macros" }
safemlx-internal-macros = { version = "0.1.1", path = "safemlx-internal-macros" }
eredu = { version = "0.4.1", path = "eredu" }
eredu-core = { version = "0.1.0", path = "eredu-core" }
eredu-text = { version = "0.1.4", path = "eredu-text", default-features = false }
eredu-checkpoint = { version = "0.1.0", path = "eredu-checkpoint" }
eredu-nn = { version = "0.1.0", path = "eredu-nn", default-features = false }
eredu-runtime = { version = "0.1.0", path = "eredu-runtime" }
eredu-architectures = { version = "0.1.0", path = "eredu-architectures" }
eredu-codec = { version = "0.1.0", path = "eredu-codec", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.23"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
clap = { version = "4", features = ["derive"] }
idna_adapter = "1"
anyhow = "1"
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
itertools = "0.15"
bindgen = "0.72"
cmake = "0.1"
cc = "1"
tempfile = "3"
half = "2"
sha2 = "0.11"
