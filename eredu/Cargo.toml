[package]
name = "eredu"
version = "0.5.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust runtime for local text, multimodal, and realtime language models"
readme = "README.md"
autotests = false
autoexamples = false
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[example]]
name = "architecture_discovery"
path = "examples/architecture_discovery.rs"

[[example]]
name = "observed_generate"
path = "examples/observed_generate.rs"
required-features = ["mlx"]

[[example]]
name = "intervened_generate"
path = "examples/intervened_generate.rs"
required-features = ["mlx"]

[[example]]
name = "component_reference_probe"
path = "examples/component_reference_probe.rs"
required-features = ["mlx"]

[[example]]
name = "component_sparse_probe"
path = "examples/component_sparse_probe.rs"
required-features = ["mlx"]

[[example]]
name = "managed_plain_memory_probe"
path = "examples/managed_plain_memory_probe.rs"
required-features = ["mlx"]

[[example]]
name = "controlled_generate"
path = "examples/controlled_generate.rs"
required-features = ["mlx"]

[[example]]
name = "gemma4_generate"
path = "examples/gemma4_generate.rs"
required-features = ["mlx"]

[[example]]
name = "gemma4_speculative_generate"
path = "examples/gemma4_speculative_generate.rs"
required-features = ["mlx"]

[[example]]
name = "gguf_generate"
path = "examples/gguf_generate.rs"
required-features = ["mlx"]

[[example]]
name = "native_tool_calling"
path = "examples/native_tool_calling.rs"
required-features = ["mlx"]

[[example]]
name = "chat_probe"
path = "examples/chat_probe.rs"
required-features = ["mlx"]

[[example]]
name = "qwen35_moe_bench"
path = "examples/qwen35_moe_bench.rs"
required-features = ["mlx"]

[[test]]
name = "backend_conformance"
path = "tests/backend_conformance.rs"

[[test]]
name = "portable_facade"
path = "tests/portable_facade.rs"

[[test]]
name = "portable_realtime_facade"
path = "tests/portable_realtime_facade.rs"

[[test]]
name = "selected_backend_api"
path = "tests/selected_backend_api.rs"
