[package]
name = "eredu"
version = "0.4.1"
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust runtime for local text, multimodal, and realtime language models"
readme = "README.md"
autotests = false
autoexamples = false

[[example]]
name = "gemma4_generate"
path = "examples/gemma4_generate.rs"
required-features = ["_mlx"]

[[example]]
name = "gemma4_speculative_generate"
path = "examples/gemma4_speculative_generate.rs"
required-features = ["_mlx"]

[[example]]
name = "gguf_generate"
path = "examples/gguf_generate.rs"
required-features = ["_mlx"]

[[example]]
name = "native_tool_calling"
path = "examples/native_tool_calling.rs"
required-features = ["_mlx"]

[[example]]
name = "qwen35_moe_bench"
path = "examples/qwen35_moe_bench.rs"
required-features = ["_mlx"]

[[test]]
name = "backend_conformance"
path = "tests/backend_conformance.rs"

[[test]]
name = "core_types"
path = "tests/core_types.rs"

[[test]]
name = "published_surface"
path = "tests/published_surface.rs"

[[test]]
name = "portable_facade"
path = "tests/portable_facade.rs"

[[test]]
name = "selected_backend_api"
path = "tests/selected_backend_api.rs"
required-features = ["_mlx"]

[[test]]
name = "automatic_planner_api"
path = "tests/automatic_planner_api.rs"
required-features = ["_mlx"]

[[test]]
name = "native_tool_checkpoints"
path = "tests/native_tool_checkpoints.rs"
required-features = ["_mlx"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
no-default-features = true
features = ["mlx", "image", "audio"]

[features]
default = ["mlx", "onig", "esaxx_fast"]

_mlx = ["dep:eredu-backend-mlx"]
mlx = [
    "_mlx",
    "eredu-backend-mlx/accelerate",
    "eredu-backend-mlx/metal",
]
cuda = ["_mlx", "eredu-backend-mlx/cuda"]
esaxx_fast = ["tokenizers/esaxx_fast", "eredu-text/esaxx_fast"]
onig = ["tokenizers/onig", "eredu-text/onig"]
nccl = ["cuda", "eredu-backend-mlx/nccl"]
image = ["_mlx", "eredu-backend-mlx/image"]
audio = ["_mlx", "eredu-backend-mlx/audio"]

[dependencies]
# Local dependencies
eredu-backend-mlx = { workspace = true, optional = true }
eredu-core.workspace = true
eredu-text = { workspace = true, default-features = false }
eredu-gguf.workspace = true
eredu-checkpoint.workspace = true
eredu-runtime.workspace = true
eredu-architectures.workspace = true

# External dependencies
serde = { version = "1", features = ["derive"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
serde_json = "1"
sha2.workspace = true
llguidance = { version = "=1.7.6", default-features = false, features = ["ahash", "lark"] }
toktrie_hf_tokenizers = "=1.7.6"

[dev-dependencies]
anyhow = "1"
