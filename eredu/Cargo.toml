[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
no-default-features = true
features = ["mlx-image", "mlx-audio"]

[features]
default = ["mlx", "onig", "esaxx_fast"]

mlx = [
    "eredu-nn/mlx",
    "dep:safemlx",
    "dep:safetensors",
    "dep:memmap2",
    "dep:tempfile",
    "dep:half",
    "dep:libc",
]
cuda = ["mlx", "safemlx/cuda"]
esaxx_fast = ["tokenizers/esaxx_fast", "eredu-text/esaxx_fast"]
onig = ["tokenizers/onig", "eredu-text/onig"]
nccl = ["cuda", "safemlx/nccl"]
mlx-media = ["mlx"]
mlx-image = ["mlx-media", "dep:image"]
mlx-audio = ["mlx-media", "dep:rustfft"]

[dependencies]
# Local dependencies
safemlx = { workspace = true, features = ["safetensors"], optional = true }
eredu-core.workspace = true
eredu-text = { workspace = true, default-features = false }
eredu-gguf.workspace = true
eredu-checkpoint.workspace = true
eredu-nn = { workspace = true, default-features = false }
eredu-runtime.workspace = true
eredu-architectures.workspace = true

# External dependencies
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
idna_adapter = "1" 
thiserror = "2"
serde_json = "1"
minijinja = "2"
safetensors = { version = "0.8", optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = { workspace = true, optional = true }
half = { workspace = true, optional = true }
sha2.workspace = true
llguidance = { version = "=1.7.6", default-features = false, features = ["ahash", "lark"] }
toktrie_hf_tokenizers = "=1.7.6"
libc = { version = "0.2", optional = true }
image = { version = "0.25", default-features = false, optional = true }
rustfft = { version = "6", optional = true }

[dev-dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
