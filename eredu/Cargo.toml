[package.metadata.docs.rs]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
no-default-features = true
features = ["mlx", "metal", "image", "audio"]

[features]
tensor-capture = [
    "eredu-core/tensor-capture",
    "eredu-runtime/tensor-capture",
    "eredu-architectures/tensor-capture",
    "eredu-backend-mlx?/tensor-capture",
    "eredu-evaluation/tensor-capture",
]
default = ["mlx", "metal", "distributed", "onig", "esaxx_fast"]

distributed = ["eredu-backend-mlx?/distributed"]

mlx = ["dep:eredu-backend-mlx", "dep:safemlx"]
accelerate = ["eredu-backend-mlx?/accelerate"]
projection-profiling = ["mlx", "eredu-backend-mlx/projection-profiling"]
metal = [
    "accelerate",
    "eredu-backend-mlx?/metal",
]
cuda = ["eredu-backend-mlx?/cuda"]
esaxx_fast = ["tokenizers/esaxx_fast", "eredu-text/esaxx_fast"]
onig = ["tokenizers/onig", "eredu-text/onig"]
nccl = ["cuda", "distributed", "eredu-backend-mlx?/nccl"]
image = ["eredu-architectures/image", "eredu-backend-mlx?/image"]
audio = ["eredu-architectures/audio", "eredu-backend-mlx?/audio"]

[lints]
workspace = true

[dependencies]
# Local dependencies
eredu-backend-mlx = { workspace = true, optional = true }
safemlx = { workspace = true, optional = true, features = ["safetensors"] }
eredu-core.workspace = true
eredu-checkpoint.workspace = true
eredu-nn.workspace = true
eredu-text = { workspace = true, default-features = false }
eredu-gguf.workspace = true
eredu-runtime.workspace = true
eredu-architectures.workspace = true
eredu-media = { workspace = true, default-features = false }

# External dependencies
serde = { version = "1", features = ["derive"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
serde_json = "1"
sha2.workspace = true
llguidance = { version = "1.8.0", default-features = false, features = ["ahash", "lark"] }
jsonschema = { version = "0.52.0", default-features = false }

anyhow = "1"

[dev-dependencies]
tempfile.workspace = true
eredu-evaluation.workspace = true
eredu-codec.workspace = true
clap = { version = "4", features = ["derive"] }
safetensors = "0.8"
