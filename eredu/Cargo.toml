[[test]]
name = "automatic_planner_api"
path = "tests/automatic_planner_api.rs"
required-features = ["mlx"]

[[test]]
name = "native_tool_checkpoints"
path = "tests/native_tool_checkpoints.rs"
required-features = ["mlx"]

[package.metadata.docs.rs]
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
no-default-features = true
features = ["mlx", "metal", "image", "audio"]

[features]
default = ["mlx", "metal", "onig", "esaxx_fast"]

mlx = ["dep:eredu-backend-mlx", "dep:safemlx"]
metal = [
    "eredu-backend-mlx?/accelerate",
    "eredu-backend-mlx?/metal",
]
cuda = ["eredu-backend-mlx?/cuda"]
esaxx_fast = ["tokenizers/esaxx_fast", "eredu-text/esaxx_fast"]
onig = ["tokenizers/onig", "eredu-text/onig"]
nccl = ["cuda", "eredu-backend-mlx?/nccl"]
image = ["eredu-architectures/image", "eredu-backend-mlx?/image"]
audio = ["eredu-architectures/audio", "eredu-backend-mlx?/audio"]

[lints]
workspace = true

[dependencies]
hashbrown = "=0.17.1"
# Local dependencies
eredu-backend-mlx = { workspace = true, optional = true }
# Canonical native types for integration fixtures; enabled only with mlx.
safemlx = { workspace = true, optional = true }
eredu-core.workspace = true
# Neutral workspace funding retained by managed facade preparation.
eredu-nn.workspace = true
eredu-checkpoint.workspace = true
eredu-text = { workspace = true, default-features = false }
eredu-gguf.workspace = true
eredu-runtime.workspace = true
eredu-architectures.workspace = true

# External dependencies
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
serde_json = { version = "1", features = ["raw_value"] }
sha2.workspace = true
llguidance = { version = "=1.8.0", default-features = false, features = ["ahash", "lark"] }
jsonschema = { version = "0.52.0", default-features = false }

[dev-dependencies]
half.workspace = true
tempfile.workspace = true
eredu-evaluation.workspace = true

[[example]]
name = "prepared_chat_generate"
required-features = ["mlx"]
